name: iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build Release (unsigned)
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project ChartEditorGCD.xcodeproj \
            -scheme ChartEditorGCD \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find ios/build/Build/Products/Release-iphoneos -name 'ChartEditorGCD.app' -print -quit | head -n1)"
          if [ -z "$APP" ]; then
            echo "ChartEditorGCD.app not found" >&2
            find ios/build -name '*.app' -print >&2 || true
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          # IPA = zip of Payload/
          OUT="ChartEditorGCD-V0.8.3-B1.ipa"
          rm -f "$OUT"
          zip -qry "$OUT" Payload
          ls -lh "$OUT"
          # sanity: g.dat inside
          unzip -l "$OUT" | grep -E 'g\.dat|ChartEditorGCD$' | head

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChartEditorGCD-V0.8.3-B1.ipa
          path: ChartEditorGCD-V0.8.3-B1.ipa
          if-no-files-found: error
          retention-days: 14
